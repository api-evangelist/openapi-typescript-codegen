description: >-
  There is no consumption cost to manage for OpenAPI TypeScript Codegen. It is a
  free, MIT-licensed npm package that runs on the consumer's own machine or CI
  runner; the provider issues no invoice, meters nothing, and returns no billing
  data. Cost to an adopting organization is its own build/CI compute plus the
  maintenance risk of depending on a package its author has declared
  unmaintained.
