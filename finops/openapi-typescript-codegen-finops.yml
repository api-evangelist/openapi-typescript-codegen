considerations:
  - name: Build-time cost only
    description: >-
      Cost lands on the consumer's CI/build minutes, not on a provider invoice.
      Generation is a local process invoked at build time.
  - name: Supply-chain / maintenance risk
    description: >-
      The maintainer has publicly declared the project unmaintained and
      recommends migrating to '@hey-api/openapi-ts'. The real financial exposure
      is migration effort, not spend.
    source: https://github.com/ferdikoomen/openapi-typescript-codegen#important-announcement
  - name: Voluntary funding
    description: >-
      GitHub Sponsors is the only money path, and it is optional.
    source: https://github.com/sponsors/ferdikoomen
