aid: openapi-typescript-codegen
name: OpenAPI TypeScript Codegen
description: >-
  OpenAPI TypeScript Codegen is an MIT-licensed Node.js library and CLI by Ferdi
  Koomen that reads an OpenAPI 2.0 or 3.0 specification — JSON or YAML, from a
  path, URL, or string — and generates a lightweight, fully typed TypeScript
  client. It emits models, services, and core runtime files for one of five HTTP
  clients (fetch, node-fetch, XHR, Axios, or Angular), and supports cancelable
  promises, union types instead of enums, runtime schemas, custom request files,
  and external $ref resolution. It is a build-time developer tool, not a hosted
  service: there is no API to call, no key to issue, and no pricing. The
  maintainer has publicly declared the project unmaintained and asks users to
  migrate to @hey-api/openapi-ts, yet maintenance releases still shipped in
  December 2025 and June 2026 and the package records roughly 2.46 million npm
  downloads a month.
